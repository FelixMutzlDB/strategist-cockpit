name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install runtime + dev deps (hash-verified)
        # Backend tests need pytest/ruff (the [dev] extra). Production install
        # uses requirements.txt only — runtime deps without pytest or ruff.
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests data scripts

      - name: Pytest
        run: pytest tests/ -v --no-header

  frontend:
    name: Frontend (TypeScript / React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check + build
        run: npm run build
