command:
  - uvicorn
  - src.backend.main:app
  - --host
  - 0.0.0.0
  - --port
  - "$DATABRICKS_APP_PORT"

env:
  - name: DATABASE_URL
    valueFrom: DATABASE_URL
  - name: DATABRICKS_WAREHOUSE_ID
    value: "071969b1ec9a91ca"
  - name: STRATEGO_ENDPOINT_NAME
    valueFrom: STRATEGO_ENDPOINT_NAME
  # OBO is mandatory in prod — without STRICT_AUTH=1 the app would fall back
  # to a local dev identity and dev DATABRICKS_TOKEN, defeating per-user authz.
  - name: STRICT_AUTH
    value: "1"
  - name: DATA_BACKEND
    value: "dbsql"
  - name: LAKEVIEW_DASHBOARD_ID
    valueFrom: LAKEVIEW_DASHBOARD_ID
  - name: GENIE_SPACE_ID
    valueFrom: GENIE_SPACE_ID
  # CSP allow-list for the Lakeview dashboard / Genie Space iframes.
  # Default to the field-eng workspace host so the deploy doesn't need a
  # separate workspace secret. Override with `valueFrom: CSP_FRAME_SRC`
  # if deploying to a different workspace.
  - name: CSP_FRAME_SRC
    value: "adb-2548836972759138.18.azuredatabricks.net"
  - name: CSP_CONNECT_SRC
    value: "adb-2548836972759138.18.azuredatabricks.net"

# User-authorization (OBO) scopes — see docs/architecture.md "Security".
# If your Databricks Apps version doesn't honor user_authorization in app.yaml,
# set the same scopes via the Apps UI: Edit app → User authorization → +Add scope.
user_authorization:
  scopes:
    # SQL warehouse access for engagements/projects reads + writes (T-206).
    - sql
    # Serving endpoint access for the Stratego Knowledge Assistant (T-205).
    - serving.serving-endpoints
    # Genie space conversations (T-202).
    - dashboards.genie
