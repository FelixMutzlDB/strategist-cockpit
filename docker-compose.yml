version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: strategist-cockpit-db
    environment:
      POSTGRES_DB: strategist_cockpit
      POSTGRES_USER: strategist
      POSTGRES_PASSWORD: strategist_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
