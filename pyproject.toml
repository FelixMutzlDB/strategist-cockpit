[project]
name = "strategist-cockpit"
version = "0.1.0"
description = "Strategist Cockpit - A data app for Databricks strategists"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "databricks-sdk>=0.38.0",
    "databricks-sql-connector>=3.6.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring Databricks credentials",
]
