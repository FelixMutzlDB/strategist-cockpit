[project]
name = "strategist-cockpit"
version = "0.1.0"
description = "Strategist Cockpit - A data app for Databricks strategists"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "databricks-sdk>=0.38.0",
    "databricks-sql-connector>=3.6.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
# Dev tooling — pytest, ruff, etc. Not installed in production containers.
# CI installs the [dev] extra so tests + lint can run.
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]
# SDR-4682 N-10: psycopg2-binary lives behind a [lakebase] extra so it
# isn't shipped in the production runtime image until the Lakebase pivot
# (T-211) actually needs it. Today no code path imports psycopg2.
lakebase = [
    "psycopg2-binary>=2.9.10",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring Databricks credentials",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "static", "src/ui/node_modules", "src/ui/dist"]

[tool.ruff.lint]
# Start lenient: error-level checks + simplifications. Tighten later.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line length is covered by formatter, not blocker
    "B008",   # FastAPI depends pattern uses Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]  # tests can import after path manipulation
"data/seed_database.py" = ["E402"]
"scripts/*" = ["E402"]
